<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta charset="utf-8">
		<title>{{ page.title }} - {{ site.title }}</title>
		{% include header.html %}
	</head>
	<body>
		{% include nav.html %}
		<div class="hero-jumbotron {{ page.id }}" style="background-image: url('./{{ page.banner }}');">
			<div class="hero-title-block">
				<h1>{{ page.title }}</h1>
			</div>
		</div>
		

		
		<div class="page content {{ page.id }} section-home">
			<div class="home-description">
				<p class="big" style="color: var(--theme-color);">{{ page.description }}</p>
				
				<p>{{ page.longdescription }}</p>
			</div>
	  
			{{ content }}
		</div>
			
		{% include footer.html %}
	</body>
</html>
